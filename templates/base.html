<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPDP — {{ symbol }} Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --amber: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Nav */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-brand {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.3px;
    }
    .nav-brand span { color: var(--blue); }
    nav a {
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    nav a:hover, nav a.active {
      color: var(--text);
      border-bottom-color: var(--blue);
    }
    .nav-right { margin-left: auto; }

    /* Layout */
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    h1 { font-size: 22px; font-weight: 600; margin-bottom: 1.5rem; letter-spacing: -0.4px; }
    h2 { font-size: 15px; font-weight: 500; color: var(--muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
    }
    .card-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .card-value { font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
    .card-value.green { color: var(--green); }
    .card-value.red   { color: var(--red); }
    .card-value.blue  { color: var(--blue); }

    /* Signal banner */
    .signal-banner {
      border-radius: 12px;
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .signal-banner.up   { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.3); }
    .signal-banner.down { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3); }
    .signal-banner.none { background: var(--surface);        border: 1px solid var(--border); }
    .signal-label { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
    .signal-label.up   { color: var(--green); }
    .signal-label.down { color: var(--red); }
    .signal-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .signal-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .badge-buy  { background: rgba(34,197,94,0.15);  color: var(--green); }
    .badge-sell { background: rgba(239,68,68,0.15);  color: var(--red); }
    .badge-hold { background: rgba(245,158,11,0.15); color: var(--amber); }
    .badge-skip { background: rgba(161,161,170,0.15);color: var(--muted); }

    /* Chart box */
    .chart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* Table */
    .table-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* Run output */
    .output-box {
      background: #0a0a0c;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      line-height: 1.7;
      color: #a8ff78;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-blue  { background: var(--blue);  color: #fff; }
    .btn-green { background: var(--green); color: #fff; }

    .empty { color: var(--muted); font-size: 14px; padding: 2rem; text-align: center; }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/"><span>SPDP</span> · {{ symbol }}</a>
  <a href="/"          {% if request.path == '/'          %}class="active"{% endif %}>Dashboard</a>
  <a href="/trades"    {% if request.path == '/trades'    %}class="active"{% endif %}>Trades</a>
  <a href="/portfolio" {% if request.path == '/portfolio' %}class="active"{% endif %}>Portfolio</a>
  <div class="nav-right">
    <a href="/run" class="btn btn-blue">▶ Run Predictor</a>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
